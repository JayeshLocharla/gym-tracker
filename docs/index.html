<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover lets the layout run under the notch and home indicator,
     which is what env(safe-area-inset-*) in the CSS then pads back out. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<title>Transform</title>
<meta name="description" content="Six-month training and nutrition plan">

<!-- Add to Home Screen: opens fullscreen with no Safari chrome. Free, no
     developer account, nothing to renew — it is still just a website. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Transform">
<meta name="theme-color" content="#F7F5F2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-180.png">

<link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header id="navbar" class="navbar" data-accent="today"></header>
  <main id="app" role="main"></main>
  <nav id="tabbar" class="tabbar" role="tablist" aria-label="Sections"></nav>
  <script type="module" src="js/app.js"></script>
</body>
</html>
